name: Imp Runner Smoke

on:
  push:
    branches: [feat/imp-sandbox-api-v2]
  workflow_dispatch:

jobs:
  smoke:
    runs-on:
      group: omni-runner
    steps:
      - name: Report correlation identifiers
        run: |
          printf '%s\n' \
            "github_repository=$GITHUB_REPOSITORY" \
            "github_run_id=$GITHUB_RUN_ID" \
            "github_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "github_job=$GITHUB_JOB" \
            "runner_name=$RUNNER_NAME"
