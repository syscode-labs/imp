name: Publish Unraid Development Image

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-images-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: target
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          git checkout --detach "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: ghcr.io/syscode-labs/imp-agent:sha-${{ steps.target.outputs.sha }}
      - env:
          SHA: ${{ steps.target.outputs.sha }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
        run: |
          jq -n --arg commit_sha "$SHA" --arg agent "ghcr.io/syscode-labs/imp-agent@$AGENT_DIGEST" '{commit_sha:$commit_sha,agent:$agent}' > image-digests.json
          cat image-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ steps.target.outputs.sha }}
          path: image-digests.json
          retention-days: 90
