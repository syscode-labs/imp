nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Ship the PriorityClasses referenced by the workload defaults below.
# Disable when the classes are managed elsewhere (e.g. a platform chart).
priorityClass:
  create: true
  critical:
    name: imp-critical
    value: 1000000
  high:
    name: imp-high
    value: 100000

operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  antiAffinity: required
  # Guaranteed QoS: requests == limits so kubelet evicts this pod last and
  # the kernel never OOM-kills it while lower-priority workloads exist.
  # The previous 128Mi limit was implicated in restart churn under watch-cache
  # pressure (see openspec change memory-pressure-guardrails).
  priorityClassName: imp-critical
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  rbac:
    cniDetection: minimal
  extraEnv: []

# Opt-in pressure lifecycle (openspec: memory-pressure-guardrails). When
# enabled the operator suspends resident ImpVMs — largest memory first — on
# nodes reporting MemoryPressure until it clears. Never auto-resumes.
pressureLifecycle:
  enabled: false

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent
    tag: ""
    pullPolicy: IfNotPresent
  priorityClassName: imp-high
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Agents run only on nodes opted in to host Imp microVMs. The Imp scheduler
  # uses the same label when selecting a node for an ImpVM.
  nodeSelector:
    imp/enabled: "true"
  tolerations: []
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
  env:
    kernelPath: ""
    # Path to the firecracker binary on the host node, installed by the
    # talos-ext-firecracker system extension. hostPath-mounted read-only into
    # the agent and KVM preflight containers, and exported as FC_BIN.
    fcBinPath: /usr/local/bin/firecracker
  extraEnv: []
  hostPaths:
    socketDir:
      # enabled: true ensures sockets survive agent pod restarts (required for
      # PID-based reattach). Setting this to false will orphan Firecracker
      # sockets on restart — breaking graceful stop for running VMs.
      enabled: true
      path: /run/imp
    imageCache:
      enabled: false
      path: /var/lib/imp/images

runtime:
  # Runtime owns Firecracker processes and host networking. Keep OnDelete until
  # controlled drain and recovery semantics exist.
  image:
    repository: ghcr.io/syscode-labs/imp-agent
    tag: ""
    pullPolicy: IfNotPresent
  priorityClassName: imp-critical
  # Requests only, deliberately NO memory limits: the runtime pod cgroup
  # contains every Firecracker guest on the node, so a limit would make
  # kubelet evict this pod — killing all VMs — under node memory pressure.
  # The high PriorityClass plus requests give it eviction protection without
  # that footgun. Size requests to base daemon overhead, not guest memory.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    imp/enabled: "true"
  updateStrategy:
    type: OnDelete
  socketPath: /run/imp/runtime.sock
  statePath: /var/lib/imp/runtime
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0

webhook:
  # When false, operator admission webhooks are disabled.
  enabled: true
  certManager:
    enabled: true
    issuerRef: {}
    duration: 8760h
    renewBefore: 720h

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
  podMonitor:
    enabled: true
    interval: 30s

grafana:
  enabled: false
  dashboardLabel:
    key: grafana_dashboard
    value: "1"
  namespace: ""
  tempo:
    datasourceUid: ""   # optional: pre-fill the Tempo datasource UID

kvm:
  # preflight blocks install/upgrade until the configured minimum number of
  # selected nodes pass a runtime /dev/kvm + Firecracker capability probe.
  # Runs as a pre-install/pre-upgrade Helm hook Job; failure blocks the release.
  preflight:
    enabled: false
    # Probe the same opted-in nodes that receive agents and ImpVMs.
    nodeSelector:
      imp/enabled: "true"
    minVerifiedNodes: 1
    timeoutSeconds: 120
    backoffLimit: 6

plugin:
  rbac:
    # readonly: grants access for imp status, imp logs, imp metrics, imp exec
    readonly:
      enabled: true
    # admin: superset of readonly; also grants imp kill, imp migrate, imp elect
    admin:
      enabled: true
