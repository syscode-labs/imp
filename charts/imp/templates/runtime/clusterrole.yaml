apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "imp.fullname" . }}-runtime
  labels:
    {{- include "imp.labels" . | nindent 4 }}
rules:
- apiGroups: ["imp.dev"]
  # impnetworks/get: the runtime process resolves NetworkRef CIDR/gateway when
  # starting a VM; all dataplane mutations stay local (Net RPC primitives).
  resources: ["impvmclasses", "impvmsnapshots", "impnetworks"]
  verbs: ["get"]
