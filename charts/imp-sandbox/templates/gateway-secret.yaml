{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "impsandbox.fullname" . }}-gateway-hmac
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "impsandbox.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $name := printf "%s-gateway-hmac" (include "impsandbox.fullname" .) }}
  {{- $secret := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if $secret }}
  hmac-key: {{ index $secret.data "hmac-key" }}
  {{- else }}
  hmac-key: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
