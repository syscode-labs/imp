{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "impsandbox.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "impsandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    matchLabels:
      {{- include "impsandbox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "impsandbox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "impsandbox.serviceAccountName" . }}
      # Node-local data plane: binds a hostPort on imp nodes. No kube API
      # traffic, no RBAC beyond the shared service account.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: {{ include "impsandbox.gateway.image" . }}
        imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
        args:
          - --socket-dir={{ .Values.gateway.socketDir }}
          - --addr=:{{ .Values.gateway.hostPort }}
        ports:
        - name: grpc
          containerPort: {{ .Values.gateway.hostPort }}
          hostPort: {{ .Values.gateway.hostPort }}
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: sockets
          mountPath: {{ .Values.gateway.socketDir }}
          readOnly: true
        - name: hmac
          mountPath: /etc/imp-sandbox-gateway
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
      volumes:
      - name: sockets
        hostPath:
          path: {{ .Values.gateway.socketDir }}
          type: Directory
      - name: hmac
        secret:
          secretName: {{ include "impsandbox.fullname" . }}-gateway-hmac
      - name: tmp
        emptyDir: {}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
