---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: impnetworkattachments.imp.dev
spec:
  group: imp.dev
  names:
    categories:
    - imp
    kind: ImpNetworkAttachment
    listKind: ImpNetworkAttachmentList
    plural: impnetworkattachments
    shortNames:
    - impnetattach
    singular: impnetworkattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vmRef.name
      name: VM
      type: string
    - jsonPath: .spec.attachmentRef
      name: Attachment
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.node
      name: Node
      type: string
    - jsonPath: .status.assignedIP
      name: IP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImpNetworkAttachment attaches one ImpVM to an administrator-allowlisted
          physical network or VLAN. Creating this resource requires permissions
          distinct from ImpVM/ImpNetwork roles. Isolated ImpNetwork networking remains
          the default for all workloads without this explicit grant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImpNetworkAttachmentSpec defines the request to attach one ImpVM to one
              administrator-allowlisted LAN/VLAN attachment definition.
            properties:
              attachmentRef:
                description: |-
                  AttachmentRef names a LAN attachment definition from
                  ClusterImpConfig.spec.networking.lanAttachments. The definition carries
                  the VLAN ID, subnet, and DHCP policy; host interfaces are never chosen
                  by users.
                maxLength: 253
                minLength: 1
                type: string
              dhcp:
                description: |-
                  DHCP declares that the guest will obtain its address via DHCP on the
                  attached network. Allowed only when the referenced definition sets
                  allowDHCP=true. Mutually exclusive with IP.
                properties:
                  enabled:
                    description: Enabled turns on the DHCP request for this attachment.
                    type: boolean
                required:
                - enabled
                type: object
              ip:
                description: |-
                  IP is a static address inside the definition subnet that the guest will
                  configure itself. Required when DHCP is not requested.
                pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}$
                type: string
              mode:
                default: access
                description: Mode selects the attachment mode. Only "access" is supported.
                enum:
                - access
                type: string
              vmRef:
                description: |-
                  VMRef references the ImpVM in the same namespace whose guest joins the
                  allowlisted network.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - attachmentRef
            - vmRef
            type: object
          status:
            description: |-
              ImpNetworkAttachmentStatus records authorization and audit state.
              Audit fields are written by the system only; treat them as immutable once set.
            properties:
              assignedIP:
                description: |-
                  AssignedIP is the address observed on the guest interface: the requested
                  static IP or the DHCP lease reported by the guest agent.
                type: string
              conditions:
                description: Conditions follow the standard k8s condition convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              macAddress:
                description: |-
                  MACAddress is the deterministic MAC assigned to the VM's attached
                  interface.
                type: string
              node:
                description: Node is the node running the referenced ImpVM at authorization
                  time.
                type: string
              phase:
                description: Phase is the high-level state of this attachment request.
                enum:
                - Pending
                - Authorized
                - Denied
                - Failed
                type: string
              requester:
                description: |-
                  Requester is the authenticated username recorded at creation time.
                  Mirrored from the imp.dev/requester annotation by admission.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
