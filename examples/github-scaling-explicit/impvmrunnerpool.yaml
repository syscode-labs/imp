apiVersion: imp.dev/v1alpha1
kind: ImpVMRunnerPool
metadata:
  name: ci-runner-explicit
  namespace: default
  annotations:
    imp.dev/runner-demand: "5"
spec:
  templateName: ci-explicit-template
  platform:
    type: github-actions
    scope:
      org: your-org
    runnerGroup: omni-runner
    credentialsSecret: github-imp-runners
    tokenSource: github_app
  labels:
    - imp
  scaling:
    mode: webhook
    minIdle: 0
    maxConcurrent: 10
    scaleUpStep: 2
    cooldownSeconds: 30
    webhook:
      secretRef: gh-webhook-secret
