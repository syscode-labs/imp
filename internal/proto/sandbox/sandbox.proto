syntax = "proto3";

// Package sandbox defines the control-session RPC surface used by the optional
// Imp Sandbox add-on. It is compiled into the guest agent but remains inert
// unless a session is opened with the configured control token.
package sandbox;

option go_package = "github.com/syscode-labs/imp/internal/proto/sandbox";

service SandboxControl {
  // OpenSession exchanges a one-time control token for a session handle.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // CloseSession invalidates a previously opened session handle.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  // Exec runs a command inside the VM within an open session.
  rpc Exec(ExecRequest) returns (ExecResponse);
  // ReadFile returns up to 1 MiB of a file inside the VM.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // WriteFile writes up to 1 MiB to a file inside the VM.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // ListDir lists one directory level inside the VM.
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  // Stat returns metadata for a path inside the VM.
  rpc Stat(StatRequest) returns (StatResponse);
  // Remove deletes a file or empty directory inside the VM.
  rpc Remove(RemoveRequest) returns (RemoveResponse);
}

message OpenSessionRequest {
  string token = 1;
}

message OpenSessionResponse {
  string session_id = 1;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {}

message ExecRequest {
  string session_id = 1;
  repeated string command = 2;
  int32 timeout_seconds = 3;
}

message ExecResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

// MaxPayloadBytes is the hard cap the guest enforces on ReadFile/WriteFile
// payloads; oversize requests are refused with ResourceExhausted.
message ReadFileRequest {
  string session_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
  int64 size = 2; // total file size; content may be truncated to the cap
  bool truncated = 3;
}

message WriteFileRequest {
  string session_id = 1;
  string path = 2;
  bytes content = 3;
  bool append = 4;
  int32 mode = 5; // permission bits; 0 -> 0644
}

message WriteFileResponse {
  int64 bytes_written = 1;
}

message ListDirRequest {
  string session_id = 1;
  string path = 2;
}

message ListDirResponse {
  repeated FileEntry entries = 1;
}

message FileEntry {
  string name = 1;
  int64 size = 2;
  bool is_dir = 3;
  int64 modified_unix = 4;
}

message StatRequest {
  string session_id = 1;
  string path = 2;
}

message StatResponse {
  int64 size = 1;
  bool is_dir = 2;
  int64 modified_unix = 3;
  int32 mode = 4;
}

message RemoveRequest {
  string session_id = 1;
  string path = 2;
  bool recursive = 3;
}

message RemoveResponse {}
